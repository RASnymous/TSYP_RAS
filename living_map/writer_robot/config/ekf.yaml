# robot_localization EKF: odom -> base_footprint for SLAM - ONLY with odom_source:=ekf
# (run_explorer.sh ekf). By default the simulation takes odom -> base_footprint
# from Gazebo's OdometryPublisher instead (the robot's true motion).
#
# The robot is a 4-wheel SKID-STEER: when it turns, the wheels scrub sideways
# and the wheel odometry over-estimates the rotation. The yaw RATE therefore
# comes from BOTH sensors: the IMU gyroscope (/imu) and the wheels (/wheel_odom).
# (v8.0 used the gyro alone; when /imu is missing or late the EKF never saw
# the robot turn, slam_toolbox never added a scan and the map stayed ~1 m wide.)
#   forward speed  vx, vy <- wheel odometry (/wheel_odom)
#   yaw rate       vyaw   <- wheel odometry AND IMU gyroscope
# slam_toolbox then corrects the remaining drift with the LiDAR (map -> odom).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true                 # planar ground robot
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom                # EKF publishes odom->base_footprint

    # --- wheel odometry from the diff_drive plugin (/wheel_odom): vx, vy and yaw rate ---
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # --- IMU (/imu): yaw rate (the gyro sees the real rotation) ---
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    use_sim_time: true
