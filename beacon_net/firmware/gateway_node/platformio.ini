; PlatformIO build for the gateway (alternative to the Arduino IDE).
;   pio run -t upload        flash      |   pio device monitor   serial console
[platformio]
src_dir = .
lib_dir = ../../lib              ; picks up lib/BeaconProto (same sources as the simulator)
default_envs = gateway

[env:gateway]
platform = espressif32
board = ttgo-lora32-v1           ; any ESP32 board works; set the pins in bp_arduino.h
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino>
lib_deps = sandeepmistry/LoRa@^0.8.0
build_flags = -DCORE_DEBUG_LEVEL=0
