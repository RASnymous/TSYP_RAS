# ros_gz_bridge parameter_bridge config: connects Gazebo (gz-transport)
# topics to ROS 2. Loaded automatically by gazebo_sim.launch.py.
#
# direction: GZ_TO_ROS | ROS_TO_GZ | BIDIRECTIONAL
# If a gz topic name doesn't match your build, run `gz topic -l` while the
# sim is running and adjust gz_topic_name here.

# --- simulation clock ---
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# --- drive command (Nav2 / teleop -> diff drive) ---
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# --- odometry: the robot's true motion (OdometryPublisher). Its TF
#     (odom -> base_footprint, gz /odom_tf) is bridged to /tf by the launch file
#     when odom_source:=gz (the default) ---
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# --- wheel odometry (diff drive; used only by the EKF, odom_source:=ekf) ---
- ros_topic_name: "/wheel_odom"
  gz_topic_name: "/wheel_odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# --- joint states (wheels + trapdoor -> robot_state_publisher / RViz) ---
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# --- beacon servo command (beacon_drop_node -> trapdoor) ---
- ros_topic_name: "/trapdoor_cmd"
  gz_topic_name: "/trapdoor_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# --- 2D LiDAR ---
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# --- IMU ---
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# --- RGB-D camera (renamed to what the vision node expects) ---
# (the point cloud is intentionally NOT bridged - it is the heaviest topic
#  and the vision node only needs the color + depth images.)
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth/image_raw"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
