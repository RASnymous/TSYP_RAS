# slam_toolbox for odom_source:=ekf (wheel + IMU odometry): scan matching and
# loop closing correct the odometry drift.
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_sim_time: true
    mode: mapping
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 2.0
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    # robustness: scan matching and loop closing on (set explicitly), and scans
    # added more often than the defaults (0.5 m / 0.5 rad), especially when turning
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    minimum_travel_distance: 0.3     # add a scan every 0.3 m ...
    minimum_travel_heading: 0.3      # ... or 0.3 rad of turning (tighter while turning)
    transform_timeout: 0.5          # tolerate TF lag when Gazebo runs slower than real time
    tf_buffer_duration: 30.0
